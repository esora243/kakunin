name: Delete merged work branch

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'develop' &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch when no open PR uses it
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          set -euo pipefail

          open_count=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$REPOSITORY/pulls?state=open&head=$HEAD_OWNER:$HEAD_REF&per_page=1" \
            --jq 'length')

          if [[ "$open_count" != "0" ]]; then
            echo "別のオープンPRが使用中のため $HEAD_REF は削除しません。"
            exit 0
          fi

          encoded_ref=$(jq -rn --arg ref "heads/$HEAD_REF" '$ref | @uri')
          gh api --method DELETE "/repos/$REPOSITORY/git/refs/$encoded_ref"
